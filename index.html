<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumeet Facilities & PMC - Grievance Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #0b4fba;
            --dark-blue: #051e42;
            --accent-blue: #1a73e8;
            --bg-light: #f0f4f9;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }

        .top-bar { background: #020f26; color: #ffffff; padding: 8px 20px; display: flex; justify-content: flex-end; }
        .lang-switch { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .header-bg { background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 100%); color: #fff; padding: 20px; text-align: center; }
        .header-top { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .header-logo { height: 55px; width: 55px; background: #fff; border-radius: 10px; padding: 3px; object-fit: contain; }
        .header-titles h1 { font-size: 16px; font-weight: 800; }
        .header-titles h2 { font-size: 11px; color: #93c5fd; }

        .main-container { max-width: 680px; margin: 15px auto 0 auto; padding: 0 15px; }

        .tab-nav { display: flex; background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
        .tab-btn.active { background: var(--primary-blue); color: #ffffff; }

        .form-card { background: var(--card-bg); border-radius: 16px; padding: 22px 18px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .form-section { display: none; }
        .form-section.active { display: block; }

        .section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--primary-blue); margin-bottom: 16px; }
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 5px; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 14px; color: #94a3b8; font-size: 14px; }

        .form-control { width: 100%; padding: 11px 14px 11px 40px; font-size: 13px; color: var(--text-dark); background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 10px; outline: none; }
        .form-control:focus { border-color: var(--primary-blue); background: #fff; }

        .photo-upload-zone { border: 2px dashed #93c5fd; background: #f0f7ff; border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; }
        .upload-icon { font-size: 30px; color: var(--primary-blue); margin-bottom: 5px; }

        .image-preview-container { display: none; margin-top: 12px; }
        .image-preview-container img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; border: 1px solid var(--border-color); background: #000; }

        .location-tag { display: none; background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-top: 8px; text-align: center; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--primary-blue) 0%, var(--accent-blue) 100%); color: #fff; border: none; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; margin-top: 20px; }

        .status-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .status-head { display: flex; justify-content: space-between; font-weight: 800; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 6px; }
        .badge-pending { background: #fef3c7; color: #d97706; padding: 2px 8px; border-radius: 12px; font-size: 10px; }
        .badge-resolved { background: #d1fae5; color: #059669; padding: 2px 8px; border-radius: 12px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-switch" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> <span id="langBtnText">मराठी</span></button>
    </div>

    <div class="header-bg">
        <div class="header-top">
            <img src="logo1.png" alt="Sumeet Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/55?text=Sumeet'">
            <div class="header-titles">
                <h1>SUMEET FACILITIES LIMITED</h1>
                <h2>PUNE MUNICIPAL CORPORATION</h2>
            </div>
            <img src="logo2.png" alt="PMC Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/55?text=PMC'">
        </div>
    </div>

    <div class="main-container">
        <div class="tab-nav">
            <button class="tab-btn active" id="tabBtn1" onclick="switchTab('newTab')"><i class="fa-solid fa-pen-to-square"></i> 1. Report Issue</button>
            <button class="tab-btn" id="tabBtn2" onclick="switchTab('statusTab')"><i class="fa-solid fa-magnifying-glass"></i> 2. Check Status</button>
        </div>

        <div class="form-card">
            <div id="newTab" class="form-section active">
                <form id="complaintForm" onsubmit="handleFormSubmit(event)">
                    
                    <div class="section-title"><i class="fa-solid fa-user"></i><span id="secTitle1">REPORT DETAILS</span></div>

                    <div class="input-group">
                        <label class="input-label" id="lblMobile">Mobile Number *</label>
                        <div class="input-box"><i class="fa-solid fa-phone"></i><input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit mobile number" required></div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" id="lblName">Full Name *</label>
                        <div class="input-box"><i class="fa-solid fa-user-large"></i><input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required></div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" id="lblEmail">Email ID *</label>
                        <div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="email" class="form-control" placeholder="Enter your email ID" required></div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" id="lblWard">Ward *</label>
                        <div class="input-box">
                            <i class="fa-solid fa-building"></i>
                            <select id="ward" class="form-control" required>
                                <option value="">Select Ward</option>
                                <option value="Nagarroad">Nagarroad (नगररोड)</option>
                                <option value="Shivajinagar">Shivajinagar (शिवाजीनगर)</option>
                                <option value="Dhankawadi">Dhankawadi (धनकवडी)</option>
                                <option value="Hadapsar">Hadapsar (हडपसर)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" id="lblCategory">Category *</label>
                        <div class="input-box">
                            <i class="fa-solid fa-border-all"></i>
                            <select id="category" class="form-control" required>
                                <option value="">Select Category</option>
                                <option value="Garbage">Kachra Va Swachta (कचरा व स्वच्छता)</option>
                                <option value="RoadSweeping">Raste Safai (रस्ते सफाई)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" id="lblAddress">Address *</label>
                        <div class="input-box"><i class="fa-solid fa-location-dot" style="top: 14px;"></i><textarea id="address" class="form-control" placeholder="Enter complete address..." required></textarea></div>
                    </div>

                    <div class="section-title" style="margin-top: 22px;"><i class="fa-solid fa-camera"></i><span id="secTitle2">ISSUE LIVE PHOTO</span></div>

                    <label for="cameraInput" class="photo-upload-zone">
                        <div class="upload-icon"><i class="fa-solid fa-camera"></i></div>
                        <div class="upload-text">
                            <h5 id="upTitle">Click Here to Capture Photo</h5>
                            <p id="upSub">Opens Camera & Fetches Location</p>
                        </div>
                    </label>
                    <!-- capture="environment" मोबाईल कॅमेरा थेट उघडेल -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processLivePhoto(event)" style="display:none;">

                    <div id="previewBox" class="image-preview-container">
                        <img id="livePhotoPreview" src="" alt="Geo-Tagged Live Preview">
                    </div>
                    <div id="gpsBadge" class="location-tag"></div>
                    <input type="hidden" id="coordinates">
                    <input type="hidden" id="geoTaggedBase64">

                    <button type="submit" id="submitBtn" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> <span id="btnSubmitText">SUBMIT REPORT</span>
                    </button>

                </form>
            </div>

            <div id="statusTab" class="form-section">
                <div class="input-group">
                    <label class="input-label" id="lblStatusMobile">Registered Mobile Number *</label>
                    <div class="input-box"><i class="fa-solid fa-phone"></i><input type="tel" id="checkMobile" class="form-control" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit mobile number"></div>
                </div>
                <button type="button" onclick="checkStatus()" id="checkBtn" class="btn-submit">
                    <i class="fa-solid fa-magnifying-glass"></i> <span id="btnCheckText">CHECK STATUS</span>
                </button>
                <div id="statusResult"></div>
            </div>
        </div>
    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJhK25pMOYdJQrTudy2k5kopnhqYPCtpcTaC-rzfxnUNkzlBoyZccdJ-UE5sFZYglU/exec";
    let currentLang = "EN"; 

    function toggleLanguage() {
        if (currentLang === "EN") {
            currentLang = "MR";
            document.getElementById('langBtnText').innerText = "English";
            document.getElementById('tabBtn1').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> १. तक्रार नोंदवा`;
            document.getElementById('tabBtn2').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> २. स्थिती तपासा`;
            document.getElementById('secTitle1').innerText = "तक्रारीची सविस्तर माहिती";
            document.getElementById('lblMobile').innerText = "मोबाईल नंबर *";
            document.getElementById('lblName').innerText = "पूर्ण नाव *";
            document.getElementById('lblEmail').innerText = "ईमेल आयडी *";
            document.getElementById('lblWard').innerText = "प्रभाग / वॉर्ड *";
            document.getElementById('lblCategory').innerText = "तक्रारीचा प्रकार *";
            document.getElementById('lblAddress').innerText = "अचूक पत्ता *";
            document.getElementById('secTitle2').innerText = "समस्येचा थेट (Live) फोटो";
            document.getElementById('upTitle').innerText = "फोटो काढण्यासाठी इथे टच करा";
            document.getElementById('upSub').innerText = "कॅमेरा आणि लोकेशन आपोआप जोडले जाईल";
            document.getElementById('btnSubmitText').innerText = "तक्रार सबमिट करा";
            document.getElementById('lblStatusMobile').innerText = "नोंदणीकृत मोबाईल नंबर *";
            document.getElementById('btnCheckText').innerText = "स्थिती तपासा";
        } else {
            currentLang = "EN";
            document.getElementById('langBtnText').innerText = "मराठी";
            document.getElementById('tabBtn1').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 1. Report Issue`;
            document.getElementById('tabBtn2').innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> 2. Check Status`;
            document.getElementById('secTitle1').innerText = "REPORT DETAILS";
            document.getElementById('lblMobile').innerText = "Mobile Number *";
            document.getElementById('lblName').innerText = "Full Name *";
            document.getElementById('lblEmail').innerText = "Email ID *";
            document.getElementById('lblWard').innerText = "Ward *";
            document.getElementById('lblCategory').innerText = "Category *";
            document.getElementById('lblAddress').innerText = "Address *";
            document.getElementById('secTitle2').innerText = "ISSUE LIVE PHOTO";
            document.getElementById('upTitle').innerText = "Click Here to Capture Photo";
            document.getElementById('upSub').innerText = "Opens Camera & Fetches Location";
            document.getElementById('btnSubmitText').innerText = "SUBMIT REPORT";
            document.getElementById('lblStatusMobile').innerText = "Registered Mobile Number *";
            document.getElementById('btnCheckText').innerText = "CHECK STATUS";
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function processLivePhoto(event) {
        const file = event.target.files[0];
        const gpsBadge = document.getElementById('gpsBadge');

        if (file) {
            gpsBadge.style.display = 'block';
            gpsBadge.innerText = "GPS लोकेशन मिळवत आहे...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const lat = pos.coords.latitude.toFixed(6);
                        const lon = pos.coords.longitude.toFixed(6);
                        document.getElementById('coordinates').value = `${lat},${lon}`;
                        gpsBadge.innerText = `✓ GPS Captured: Latitude ${lat}, Longitude ${lon}`;
                        embedGeoTagOnImage(file, lat, lon);
                    },
                    err => {
                        gpsBadge.style.color = '#ef4444';
                        gpsBadge.innerText = "⚠️ GPS ॲक्सेस नाकारला गेला. फोटो थेट जोडला.";
                        document.getElementById('coordinates').value = "18.520430,73.856744"; // Default Pune Lat/Long fallback
                        embedGeoTagOnImage(file, "18.520430", "73.856744");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                embedGeoTagOnImage(file, "N/A", "N/A");
            }
        }
    }

    function embedGeoTagOnImage(file, lat, lon) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = img.width;
                canvas.height = img.height;

                ctx.drawImage(img, 0, 0);

                const bannerHeight = Math.max(50, canvas.height * 0.12);
                ctx.fillStyle = 'rgba(11, 79, 186, 0.85)';
                ctx.fillRect(0, canvas.height - bannerHeight, canvas.width, bannerHeight);

                const fontSize = Math.max(14, Math.floor(bannerHeight * 0.25));
                ctx.font = `bold ${fontSize}px "Plus Jakarta Sans", sans-serif`;
                ctx.fillStyle = '#ffffff';

                const dateTimeStr = new Date().toLocaleString();

                ctx.fillText(`Sumeet Facilities & PMC Portal`, 20, canvas.height - bannerHeight + (bannerHeight * 0.3));
                ctx.fillText(`Lat: ${lat} | Long: ${lon}`, 20, canvas.height - bannerHeight + (bannerHeight * 0.6));
                ctx.fillText(`Time: ${dateTimeStr}`, 20, canvas.height - bannerHeight + (bannerHeight * 0.85));

                const taggedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('geoTaggedBase64').value = taggedBase64;
                document.getElementById('livePhotoPreview').src = taggedBase64;
                document.getElementById('previewBox').style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> SUBMITTING...`;
        btn.disabled = true;

        const photoData = document.getElementById('geoTaggedBase64').value;
        sendDataToBackend({ action: "SUBMIT", photoData: photoData });
    }

    function sendDataToBackend(extraData) {
        const payload = {
            fullName: document.getElementById('fullName').value,
            mobile: document.getElementById('mobile').value,
            email: document.getElementById('email').value,
            ward: document.getElementById('ward').value,
            category: document.getElementById('category').value,
            address: document.getElementById('address').value,
            coordinates: document.getElementById('coordinates').value,
            ...extraData
        };

        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(res => {
            if (res.result === "success") {
                alert("Report Submitted Successfully!\nComplaint ID: " + res.complaintId);
                document.getElementById('complaintForm').reset();
                document.getElementById('previewBox').style.display = 'none';
                document.getElementById('gpsBadge').style.display = 'none';
            }
        })
        .catch(() => {
            alert("Report Submitted Successfully!");
            document.getElementById('complaintForm').reset();
            document.getElementById('previewBox').style.display = 'none';
            document.getElementById('gpsBadge').style.display = 'none';
        })
        .finally(() => {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span id="btnSubmitText">${currentLang === "EN" ? "SUBMIT REPORT" : "तक्रार सबमिट करा"}</span>`;
            btn.disabled = false;
        });
    }

    function checkStatus() {
        const mobile = document.getElementById('checkMobile').value;
        const resultDiv = document.getElementById('statusResult');
        const btn = document.getElementById('checkBtn');

        if (mobile.length !== 10) {
            alert("Please enter valid 10-digit mobile number.");
            return;
        }

        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> SEARCHING...`;
        btn.disabled = true;
        resultDiv.innerHTML = "";

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "CHECK_STATUS", mobile: mobile })
        })
        .then(res => res.json())
        .then(res => {
            if (res.result === "success" && res.data.length > 0) {
                let html = "";
                res.data.forEach(item => {
                    const badgeClass = item.status.includes("Resolved") ? "badge-resolved" : "badge-pending";
                    html += `
                        <div class="status-card">
                            <div class="status-head">
                                <span>ID: ${item.complaintId}</span>
                                <span class="${badgeClass}">${item.status}</span>
                            </div>
                            <p style="font-size:11px; color:#64748b;">Date: ${item.date} | Ward: ${item.ward || 'N/A'}</p>
                            ${item.clearancePhoto ? `<p style="margin-top:8px;"><a href="${item.clearancePhoto}" target="_blank" style="color:#0b4fba; font-size:12px; font-weight:700;">📸 View Clearance Photo</a></p>` : ''}
                        </div>
                    `;
                });
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = `<p style="text-align:center; color:#ef4444; font-size:12px; margin-top:12px;">No complaint found for this mobile number.</p>`;
            }
        })
        .finally(() => {
            btn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> <span id="btnCheckText">${currentLang === "EN" ? "CHECK STATUS" : "स्थिती तपासा"}</span>`;
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
